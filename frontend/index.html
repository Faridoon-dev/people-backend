<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact registry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="layout">
    <section class="intro">
      <h1>Add a person to the registry</h1>
      <p>Fill in the details and save. Every entry is stored in your Postgres database.</p>
    </section>

    <section class="panel">
      <form id="person-form" novalidate>
        <div class="row">
          <label>
            First name
            <input type="text" name="firstName" autocomplete="given-name" required />
          </label>
          <label>
            Last name
            <input type="text" name="lastName" autocomplete="family-name" required />
          </label>
        </div>

        <label>
          Phone
          <input type="tel" name="phone" autocomplete="tel" placeholder="+49 170 1234567" required />
        </label>

        <div class="row">
          <label>
            Gender
            <select name="gender" required>
              <option value="" disabled selected>Select</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
          </label>
          <label>
            Age
            <input type="number" name="age" min="0" max="120" inputmode="numeric" required />
          </label>
        </div>

        <button type="submit" id="submit-btn">Save person</button>
        <p id="message" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="saved">
      <h2>Saved people</h2>
      <ul id="people-list">
        <li class="empty">Nothing saved yet. Your first entry will show up here.</li>
      </ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
